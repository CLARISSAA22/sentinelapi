{% extends "base.html" %}

{% block title %}Sign In | SentinelAPI{% endblock %}

{% block public_content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6);">
    <div class="card" style="width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);">
        <div class="card-header" style="flex-direction: column; text-align: center; gap: var(--space-2); padding: var(--space-6) var(--space-6) var(--space-4);">
            <div class="brand-icon" style="margin: 0 auto; width: 44px; height: 44px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#050816" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            </div>
            <h2 style="font-size: 20px; font-weight: 700; color: #fff;">Sign In to SentinelAPI</h2>
            <p style="font-size: 13px; color: var(--text-secondary);">Enterprise API Security Operations</p>
        </div>

        <div class="card-body" style="padding: var(--space-6);">
            {% if error %}
            <div style="background: var(--color-critical-bg); border: 1px solid var(--color-critical-border); border-radius: var(--radius-sm); padding: var(--space-3); margin-bottom: var(--space-5); color: var(--color-critical); font-size: 13px; display: flex; align-items: center; gap: var(--space-2);">
                <i data-icon="alert-circle" data-size="16" data-color="var(--color-critical)"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.login_page') }}">
                <div class="form-group">
                    <label class="form-label" for="username">Username or Email</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="admin@enterprise.com" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; height: 42px; margin-top: var(--space-2); font-size: 14px;">
                    <i data-icon="lock" data-size="16"></i>
                    <span>Authenticate Session</span>
                </button>
            </form>
        </div>

        <div class="card-footer" style="text-align: center; font-size: 13px; color: var(--text-secondary);">
            Don't have an account? <a href="{{ url_for('auth.register_page') }}" style="font-weight: 600;">Register Workspace</a>
        </div>
    </div>
</div>
{% endblock %}
